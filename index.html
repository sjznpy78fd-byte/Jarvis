<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Hologram</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:manipulation}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c');
const ctx=c.getContext('2d');
let W,H,D,t=0,sound=0,target=0,started=false;
let particles=[],stream=null,analyser=null,audioData=null;

function resize(){
 D=Math.min(devicePixelRatio||1,2);
 W=innerWidth;H=innerHeight;
 c.width=W*D;c.height=H*D;
 ctx.setTransform(D,0,0,D,0,0);
 particles=Array.from({length:280},()=>({
  a:Math.random()*Math.PI*2,
  r:.12+Math.random()*.46,
  y:(Math.random()-.5)*1.7,
  v:(Math.random()-.5)*.012,
  size:.4+Math.random()*1.8,
  phase:Math.random()*7
 }));
}
addEventListener('resize',resize);resize();

function glow(x,y,r,color,blur=15){
 ctx.save();ctx.shadowBlur=blur;ctx.shadowColor=color;
 ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);
 ctx.fill();ctx.restore();
}
function line(points,color,width=1,blur=8){
 ctx.save();ctx.beginPath();
 points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));
 ctx.strokeStyle=color;ctx.lineWidth=width;
 ctx.shadowColor=color;ctx.shadowBlur=blur;ctx.stroke();ctx.restore();
}
function ellipse(cx,cy,rx,ry,angle,color,width=1,blur=10,start=0,end=Math.PI*2){
 ctx.save();ctx.translate(cx,cy);ctx.rotate(angle);
 ctx.beginPath();ctx.ellipse(0,0,rx,ry,0,start,end);
 ctx.strokeStyle=color;ctx.lineWidth=width;
 ctx.shadowColor=color;ctx.shadowBlur=blur;ctx.stroke();ctx.restore();
}
function polygon(cx,cy,r,n,angle,color){
 const p=[];
 for(let i=0;i<=n;i++){
  const a=angle+i*Math.PI*2/n;
  p.push({x:cx+Math.cos(a)*r,y:cy+Math.sin(a)*r});
 }
 line(p,color,.8,8);
}

function draw(){
 t+=.012;
 if(analyser){
  analyser.getByteFrequencyData(audioData);
  let sum=0;
  for(let i=0;i<audioData.length;i++)sum+=audioData[i];
  target=Math.min(1,sum/audioData.length/90);
 }
 sound+=(target-sound)*.13;
 target*=.88;

 ctx.clearRect(0,0,W,H);
 ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);

 const cx=W/2,cy=H*.46;
 const unit=Math.min(W,H)*(.32+sound*.035);
 const pulse=1+Math.sin(t*2)*.018+sound*.12;

 ctx.save();
 ctx.translate(cx,cy);
 ctx.scale(pulse,1);

 // Dış enerji alanı
 const aura=ctx.createRadialGradient(0,0,unit*.05,0,0,unit*1.5);
 aura.addColorStop(0,'rgba(0,100,255,.13)');
 aura.addColorStop(.45,'rgba(0,65,210,.07)');
 aura.addColorStop(1,'rgba(0,0,0,0)');
 ctx.fillStyle=aura;ctx.fillRect(-unit*1.6,-unit*1.6,unit*3.2,unit*3.2);

 // Derin uzay halkaları
 for(let i=0;i<7;i++){
  const a=t*(i%2?-.12:.09)+i*.51;
  ellipse(0,0,unit*(.43+i*.085),unit*(.19+i*.025),
   a,'rgba(15,125,255,'+(.38-i*.035)+')',i%3===0?1.5:.7,12);
 }

 // Dönen geometrik enerji kafesi
 for(let i=0;i<3;i++){
  const a=t*(i%2?-.28:.21)+i*1.7;
  ctx.save();ctx.rotate(a);
  ellipse(0,0,unit*.62,unit*(.28+i*.035),i*.5,
   'rgba(20,150,255,.75)',1,15);
  polygon(0,0,unit*(.48+i*.06),6,a*.3,
   'rgba(28,120,255,.45)');
  ctx.restore();
 }

 // Parlak, kıvrımlı enerji şeritleri
 for(let j=0;j<8;j++){
  const pts=[],phase=t*(j%2?1:-1)+j*Math.PI/4;
  for(let i=0;i<=100;i++){
   const u=i/100,ang=u*Math.PI*2+phase;
   const rr=unit*(.19+.32*Math.sin(u*Math.PI)+.04*Math.sin(ang*4+t*2));
   pts.push({
    x:Math.cos(ang)*rr,
    y:Math.sin(ang)*rr*.72
   });
  }
  line(pts,j%2?'rgba(65,190,255,.8)':'rgba(0,105,255,.65)',
   j%3===0?1.8:.9,18);
 }

 // Merkez enerji küresi
 const cr=unit*(.19+sound*.07);
 const g=ctx.createRadialGradient(-cr*.35,-cr*.4,1,0,0,cr*1.5);
 g.addColorStop(0,'#ffffff');
 g.addColorStop(.12,'#a6f4ff');
 g.addColorStop(.3,'#36bdff');
 g.addColorStop(.58,'#0874ff');
 g.addColorStop(.82,'rgba(0,43,150,.85)');
 g.addColorStop(1,'rgba(0,0,0,0)');
 ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,cr*1.5,0,Math.PI*2);ctx.fill();

 // Kürenin içindeki enerji çizgileri
 for(let i=0;i<12;i++){
  const y=(i-5.5)*cr*.19;
  const ww=Math.sqrt(Math.max(0,cr*cr-y*y));
  ellipse(0,y,ww,Math.max(1,cr*.025),t+i*.2,
   'rgba(130,225,255,.42)',.7,7);
 }

 // Işık parçacıkları
 for(const p of particles){
  p.a+=p.v;
  const rr=unit*p.r;
  const x=Math.cos(p.a)*rr;
  const y=Math.sin(p.a)*rr*.72+p.y*unit*.18;
  const alpha=.25+.65*(.5+.5*Math.sin(t*3+p.phase));
  glow(x,y,p.size*(1+sound),`rgba(60,175,255,${alpha})`,8);
 }

 // İnce tarama ışıkları
 for(let i=0;i<4;i++){
  const a=t*.7+i*Math.PI/2;
  const x=Math.cos(a)*unit*.78;
  const y=Math.sin(a)*unit*.4;
  glow(x,y,2+sound*4,'#9befff',18);
 }
 ctx.restore();

 // Alt holografik platform
 const py=cy+unit*.82;
 for(let i=0;i<9;i++){
  const w=unit*(1.1-i*.075);
  ellipse(cx,py+i*1.6,w,unit*(.17-i*.009),
   0,`rgba(0,130,255,${.45-i*.035})`,i===0?1.5:.7,12);
 }
 const beam=ctx.createLinearGradient(0,cy+unit*.35,0,py);
 beam.addColorStop(0,'rgba(0,100,255,0)');
 beam.addColorStop(.5,`rgba(0,115,255,${.04+sound*.12})`);
 beam.addColorStop(1,'rgba(0,130,255,0)');
 ctx.fillStyle=beam;
 ctx.fillRect(cx-unit*.48,cy+unit*.3,unit*.96,unit*.55);

 requestAnimationFrame(draw);
}
draw();

// İlk ekran dokunuşunda mikrofon izni istemeyi dener.
// Ekranda düğme veya yazı gösterilmez.
async function enableMic(){
 if(started)return;
 started=true;
 try{
  stream=await navigator.mediaDevices.getUserMedia({audio:true});
  const AC=window.AudioContext||window.webkitAudioContext;
  const ac=new AC();
  await ac.resume();
  analyser=ac.createAnalyser();
  analyser.fftSize=256;
  ac.createMediaStreamSource(stream).connect(analyser);
  audioData=new Uint8Array(analyser.frequencyBinCount);
 }catch(e){}
}
document.addEventListener('pointerdown',enableMic,{once:true});
</script>
</body>
</html>
